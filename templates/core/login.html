{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Login</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                {{ form.email.label_tag }}
                {{ form.email }}
            </div>

            <div class="form-group">
                {{ form.password.label_tag }}
                {{ form.password }}
            </div>

            <button type="submit" class="auth-btn">Login</button>
        </form>
    </div>
</div>

{% endblock %}
