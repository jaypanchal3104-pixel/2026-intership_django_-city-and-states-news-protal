{% extends 'base.html' %}

{% block title %}Home - News{% endblock %}

{% block content %}

<h2>Latest News</h2>

{% for news in news_list %}
<div class="news-card">
    <h3>{{ news.title }}</h3>
    <p>{{ news.content|truncatewords:20 }}</p>
    <p><b>Category:</b> {{ news.category }}</p>
    <a href="{% url 'news_detail' news.id %}">Read More</a>
</div>
<hr>
{% empty %}
<p>No news available.</p>
{% endfor %}

{% endblock %}
