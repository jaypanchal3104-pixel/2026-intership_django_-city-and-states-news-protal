{% extends 'base.html' %}

{% block title %}News Details{% endblock %}

{% block content %}

<h2>{{ news.title }}</h2>

<p><b>Category:</b> {{ news.category }}</p>
<p><b>Author:</b> {{ news.author }}</p>
<p><b>Date:</b> {{ news.created_at }}</p>

<hr>

<p>{{ news.content }}</p>

<a href="{% url 'home' %}">← Back to Home</a>

{% endblock %}
