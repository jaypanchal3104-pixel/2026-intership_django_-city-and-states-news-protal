<!DOCTYPE html>
<html>
<head>
    <title>Action Page</title>
    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#1d2671,#c33764);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
            width:350px;
        }

        h2{
            margin-bottom:30px;
        }

        .btn{
            display:block;
            width:100%;
            padding:12px;
            margin:10px 0;
            text-decoration:none;
            color:white;
            border-radius:8px;
            font-weight:bold;
            transition:0.3s;
        }

        .dashboard{
            background:#28a745;
        }

        .logout{
            background:#dc3545;
        }

        .btn:hover{
            opacity:0.85;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Choose Action</h2>

        <!-- Back to Dashboard -->
        <a href="{% url 'dashboardRedirectView' %}" class="btn dashboard">
            Back to Dashboard
        </a>

        <!-- Logout -->
        <a href="{% url 'logoutView' %}" class="btn logout">
            Logout
        </a>
    </div>

</body>
</html>
